name: Android (APK)

on:
  push:
    branches: [main, 'android/**']
    paths:
      - android/**
      - shared/**
      - .github/workflows/android.yml
  pull_request:
    paths:
      - android/**
      - shared/**
      - .github/workflows/android.yml
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: android

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      # 固定簽章：用存在 GitHub Secrets 的同一把金鑰，手機上才能直接覆蓋安裝新版（App 內更新）
      - name: Signing key
        working-directory: .
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/signing.p12"
            {
              echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/signing.p12"
              echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "ANDROID_KEY_ALIAS=$KEY_ALIAS"
            } >> "$GITHUB_ENV"
            echo "使用固定的簽章金鑰"
          elif [ "$GITHUB_REF" = "refs/heads/main" ] && [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            # 正式版絕不能用隨機金鑰發佈，否則使用者無法覆蓋更新
            echo "::error::缺少 ANDROID_KEYSTORE_B64，正式版不能用隨機的除錯金鑰簽章"; exit 1
          else
            echo "沒有固定金鑰，使用除錯金鑰（只用於測試，不發佈）"
          fi
      - name: Core tests (golden files shared with the Windows version)
        run: ./gradlew :core:test --stacktrace
      - name: Build APK
        run: ./gradlew :app:assembleDebug --stacktrace
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk StarSaviorJourneyHelper.apk
      - uses: actions/upload-artifact@v4
        with:
          name: StarSaviorJourneyHelper-apk
          path: android/StarSaviorJourneyHelper.apk

  emulator-test:
    # 在模擬器上用真實截圖測試 ML Kit 文字辨識與 OpenCV 卡圖比對
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      # 先建好 APK 並停止 Gradle，避免與模擬器同時執行耗盡記憶體
      - name: Build app and test APKs
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest && ./gradlew --stop
      - name: Enable KVM
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          ram-size: 3072M
          disable-animations: true
          working-directory: android
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb logcat -c
            adb shell am instrument -w -r com.starsavior.helper.test/androidx.test.runner.AndroidJUnitRunner > instrument.txt; cat instrument.txt
            adb logcat -d -s RecognitionTest:I CardMatcher:W
            grep -q "^OK (" instrument.txt

  publish:
    # main → android-latest（正式版）；其他分支 → android-preview（測試版，手機可直接點連結下載）
    needs: [build, emulator-test]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: StarSaviorJourneyHelper-apk
          path: .
      - name: Publish release
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            TAG=android-latest; TITLE="StarSavior 旅程助手 Android 版（最新版）"; EXTRA=""
          else
            TAG=android-preview; TITLE="StarSavior 旅程助手 Android 版（測試版：${GITHUB_REF_NAME}）"; EXTRA="--prerelease"
          fi
          FILES="StarSaviorJourneyHelper.apk"
          if [ "$TAG" = "android-latest" ]; then
            # 正式版附上 version.json，App 啟動畫面用它檢查有沒有新版本
            printf '{"commit":"%s","url":"https://github.com/%s/releases/download/android-latest/StarSaviorJourneyHelper.apk"}' \
              "$GITHUB_SHA" "$GITHUB_REPOSITORY" > version.json
            FILES="$FILES version.json"
          fi
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" $FILES --target "$GITHUB_SHA" --title "$TITLE" $EXTRA \
            --notes "用手機直接下載 StarSaviorJourneyHelper.apk 安裝（需允許「安裝未知應用程式」）。commit: $GITHUB_SHA"
