name: Dump Korean strings

on:
  workflow_dispatch:
  push:
    paths:
      - tools/dump_strings.py
      - .github/workflows/dump-strings.yml

permissions:
  contents: write

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install certifi requests opencc-python-reimplemented
      - run: python tools/dump_strings.py translations/source_ko.json
      - name: Commit string list
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add translations/source_ko.json translations/multi_variants.json
          git diff --cached --quiet || git commit -m "Update Korean source strings from website"
          git push
