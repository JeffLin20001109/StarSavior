name: Dump Korean strings

# 下載網站資料，更新 shared/strings/：全部韓文字串、多版本事件、譯文表還缺的句子
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - desktop/tools/dump_strings.py
      - .github/workflows/dump-strings.yml

permissions:
  contents: write

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install certifi requests
      - run: python desktop/tools/dump_strings.py shared/strings/source_ko.json
      - name: Commit string list
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shared/strings
          git diff --cached --quiet || git commit -m "Update Korean source strings from website"
          git push
