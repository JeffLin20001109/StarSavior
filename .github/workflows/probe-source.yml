name: Probe data source

# 調查資料來源網站的結構（一次性分析用），結果存到 shared/sources/
on:
  workflow_dispatch:
  push:
    branches: ['data/**']
    paths:
      - tools/probe_site.py
      - .github/workflows/probe-source.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests
      - run: python tools/probe_site.py https://starsavior-db.pages.dev shared/sources/starsavior-db/probe
      - name: Commit probe results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shared/sources
          git diff --cached --quiet || git commit -m "Probe results for starsavior-db"
          git push
